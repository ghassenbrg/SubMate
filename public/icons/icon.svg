<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024" role="img" aria-label="SubMate">
  <title>SubMate</title>
  <!--
    Vector redraw of docs/icon.png, the master artwork, for places a crisp
    scalable mark matters (popup and options headers). The PNG icons in this
    folder are resized from docs/icon.png directly.

    The glyph (play triangle and the two subtitle bars) is the same geometry
    markSvg() inlines in src/renderer/subtitle-overlay.ts; keep them in step.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#16202f"/>
      <stop offset="1" stop-color="#0a0d15"/>
    </linearGradient>
    <radialGradient id="glow" cx=".96" cy=".04" r=".78">
      <stop offset="0" stop-color="#1d3b82" stop-opacity=".75"/>
      <stop offset="1" stop-color="#1d3b82" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="play" x1="33" y1="16" x2="70" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38f7ee"/>
      <stop offset=".5" stop-color="#19b9fb"/>
      <stop offset="1" stop-color="#1f66f5"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#tile)"/>
  <rect width="100" height="100" rx="24" fill="url(#glow)"/>
  <path d="M37.5 21.5v31.8l29-15.9z" fill="url(#play)" stroke="url(#play)" stroke-width="10" stroke-linejoin="round"/>
  <rect x="19" y="63.8" width="62.6" height="8.4" rx="4.2" fill="#f2f6fb"/>
  <rect x="30.1" y="77.5" width="40.4" height="6.7" rx="3.35" fill="#6f83a4"/>
</svg>
